<title>Sustituciones Gabriel Celaya</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#BF1D29"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sustituciones">

<style>
/* Concepto: cuaderno de jefatura de estudios. Fondo azul grisáceo, tarjetas blancas y un solo azul ultramar de acento; cada nivel de sustitución tiene su propio color. */
:root {

  --font-b: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141011; --surface: #1F1819; --surface2: #281F21; --ink: #F8EAE7; --muted: #BBA3A5; --line: #3A2C2E;
  --accent: #FF6B74; --accent-ink: #1B1416; --accent-soft: #43202A;
  --ok: #5ED19B; --warn: #F0B79F; --warn-soft: #3E2620; --bad: #FF8F85; --bad-soft: #43201F;
  --t1: #D9CFCE; --t2: #FF6B74; --t3: #E0A39A; --t4: #F08BB1;
  --t1s: #34292B; --t2s: #4B2227; --t3s: #402A27; --t4s: #4A2336; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141011; --surface: #1F1819; --surface2: #281F21; --ink: #F8EAE7; --muted: #BBA3A5; --line: #3A2C2E;
  --accent: #FF6B74; --accent-ink: #1B1416; --accent-soft: #43202A;
  --ok: #5ED19B; --warn: #F0B79F; --warn-soft: #3E2620; --bad: #FF8F85; --bad-soft: #43201F;
  --t1: #D9CFCE; --t2: #FF6B74; --t3: #E0A39A; --t4: #F08BB1;
  --t1s: #34292B; --t2s: #4B2227; --t3s: #402A27; --t4s: #4A2336; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-b);
  padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-d); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .5rem; }
code { background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: .9em; }
.app { max-width: 1040px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 10px 16px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-bottom: 4px solid var(--accent); border-radius: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { height: 68px; width: auto; display: block; background: #fff; border-radius: 8px; padding: 3px 6px; flex: none; }
.brand .ttl { border-left: 3px solid var(--accent); padding-left: 12px; }

.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }

.card.narrow { max-width: 460px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.cap { margin-top: 2px; }
details.card summary { cursor: pointer; font-weight: 700; }

.muted { color: var(--muted); } .small { font-size: .85rem; } .center { text-align: center; }
.ok { color: var(--ok); font-weight: 700; }
.grow { flex: 1; min-width: 0; }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 12px; }
.row-end { display: flex; justify-content: flex-end; margin-top: 10px; gap: 8px; }
.row-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; appearance: none; font: 700 .95rem var(--font-b); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 14px; cursor: pointer; }

.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

.pill.tier.t2 { background: var(--t2s); color: var(--t2); border-color: transparent; }
.pill.tier.t3 { background: var(--t3s); color: var(--t3); border-color: transparent; }
.pill.tier.t6 { background: var(--t3s); color: var(--t3); border-color: transparent; }
.pill.tier.t7 { background: var(--t4s); color: var(--t4); border-color: transparent; }
.pill.tier.t5 { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.tier.t4 { background: var(--t4s); color: var(--t4); border-color: transparent; }

.banners { display: flex; flex-direction: column; gap: 6px; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin: 0; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--ink); border-radius: 12px; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 700 2.3rem var(--font-d); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { color: var(--muted); font-size: .85rem; }
.stat.bad { background: var(--bad-soft); border-top-color: var(--bad); } .stat.bad b { color: var(--bad); }
.stat.good { border-top-color: var(--ok); } .stat.good b { color: var(--ok); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl-row { display: grid; grid-template-columns: 76px 20px 1fr; gap: 10px; position: relative; padding: 8px 0; }
.tl-row::before { content: ''; position: absolute; left: 86px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl-row:first-child::before { top: 20px; } .tl-row:last-child::before { bottom: calc(100% - 20px); }
.tl-time { display: flex; flex-direction: column; line-height: 1.2; text-align: right; }
.tl-time .time { margin: 0; font-size: .78rem; }
.tl-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); margin-top: 3px; justify-self: center; position: relative; z-index: 1; }
.tl-row.is-ok .tl-dot { border-color: var(--ok); background: var(--ok); }
.tl-row.is-bad .tl-dot { border-color: var(--bad); background: var(--bad); }
.tl-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tl-item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; background: var(--surface2); border-radius: 8px; padding: 6px 10px; }
.tl-arrow { color: var(--accent); font-weight: 700; } .tl-sub.bad { color: var(--bad); }
@media (max-width: 520px) { .tl-row { grid-template-columns: 56px 16px 1fr; } .tl-row::before { left: 64px; } .stat b { font-size: 1.9rem; } }

.row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.card-head + .row, h3 + .row, .day-head + .row, .slot-head + .row { border-top: 0; }
.row.sub { align-items: flex-start; }
.row.quiet { opacity: .8; }
.row.notif.cancela { border-left: 3px solid var(--bad); padding-left: 10px; }
.row.notif.asigna { border-left: 3px solid var(--accent); padding-left: 10px; }
.slot-group { margin-top: 14px; }
.slot-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; background: var(--surface2); border-radius: 8px; padding: 6px 10px; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; margin-left: 6px; }
.slot-head .time { margin-left: 0; }
.sub-pick { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 230px; }
.sub-pick select { width: 100%; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.time-col { display: flex; flex-direction: column; min-width: 78px; }
.time-col .time { margin: 0; }
.day-head { font: 600 1.05rem var(--font-d); text-transform: capitalize; margin: 14px 0 2px; display: flex; gap: 8px; align-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.col { flex-direction: column; align-items: flex-start; margin: 8px 0; }
.chip { background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-family: var(--font-b); }
.chip.jefe { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.chip.me { border-color: var(--accent); }
.chip.pick { cursor: pointer; } .chip.pick.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0 2px; }
.picker { margin-bottom: 4px; }

.card-head.tight { margin-bottom: 4px; flex-wrap: nowrap; }
.field.short input { width: 90px; } .field.short { max-width: 260px; }
.patio-sec { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.patio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.day-col select { width: 100%; }

.scroll { overflow-x: auto; }
.sched { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 560px; }
.sched th, .sched td { border: 0; padding: 0; vertical-align: top; text-align: center; font-size: .9rem; }
.sched thead th { padding: 6px 4px; font: 700 .85rem var(--font-d); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sched thead th.today { color: var(--accent); }
.sched tbody th { text-align: left; white-space: nowrap; padding: 6px 8px; font-weight: 700; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.sched tbody th .time { display: block; margin: 0; font-weight: 400; font-size: .78rem; }
.sched tr.recreo th { color: var(--muted); font-weight: 400; }
.sched tr.recreo td { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface2) 6px 12px); border-radius: 8px; }
.sched td.today { background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 8px; }
.cell { display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 46px; border-radius: 8px; padding: 5px 8px; border-left: 4px solid var(--line); background: var(--surface2); text-align: left; line-height: 1.2; }
.cell b { font-weight: 700; } .cell small { color: var(--muted); font-size: .75rem; }
.cell.c { background: var(--surface2); border-left-color: var(--ink); }
.cell.l { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-left-color: var(--ok); color: var(--ok); }
.cell.a { background: var(--t2s); border-left-color: var(--t2); color: var(--t2); }
.cell.o { background: var(--t3s); border-left-color: var(--t3); color: var(--t3); }
.cell.s { background: var(--t4s); border-left-color: var(--t4); color: var(--t4); }
.cell.n { background: transparent; border-left-color: transparent; color: var(--muted); text-align: center; }
.cell.patio { background: var(--ink); border-left-color: var(--accent); color: var(--bg); }
.patio-sec .sched td, .sched.sm td { padding: 6px 8px; text-align: left; } .sched.sm td { text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 8px; font-size: .85rem; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; } .lg .cell { display: inline-block; min-height: 0; width: 14px; height: 14px; padding: 0; border-left-width: 4px; border-radius: 4px; }
.cell-sel.o { background: var(--t3s); } .cell-sel.s { background: var(--t4s); }
.cell-sel, .cell-g { width: 100%; padding: 4px 6px; font-size: .85rem; }
.cell-g { margin-top: 3px; }
.cell-sel.l { background: var(--t1s); } .cell-sel.a { background: var(--t2s); } .cell-sel.n { color: var(--muted); }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.steps { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

.msgs { display: flex; flex-direction: column; gap: 8px; max-height: 380px; min-height: 120px; overflow-y: auto; padding: 12px; background: var(--surface2); border-radius: 8px; margin: 10px 0; }
.msg { max-width: 82%; align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.msg.mine { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
.msg.jefe .msg-meta { color: var(--accent); }
.msg-meta { font-size: .78rem; font-weight: 700; color: var(--muted); }
.msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.composer { display: flex; gap: 8px; } .composer input { flex: 1; }
.cover { min-width: 220px; display: flex; flex-direction: column; gap: 2px; }
.mine-line { color: var(--accent); font-weight: 700; } .bad-t { color: var(--bad); }
.lost { color: var(--t3); margin-top: 4px; }
.ok-card { border-color: var(--ok); } .ok-card h3 { color: var(--ok); }
.row.link { width: 100%; background: none; border-width: 1px 0 0; border-style: solid; border-color: var(--line); color: inherit; font: inherit; cursor: pointer; text-align: left; }
.row.link:hover { background: var(--surface2); } .nowrap { white-space: nowrap; } .left { text-align: left; }
.sched.sm { min-width: 520px; } .sched.sm td { text-align: center; } .smchk { width: 20px; height: 20px; accent-color: var(--accent); padding: 0; } .time.block { display: block; margin: 0; font-weight: 400; }
.empty { text-align: center; padding: 36px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty h3 { margin-bottom: 6px; } .empty p { max-width: 46ch; margin-inline: auto; }
.empty-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 28px; margin: 0 auto 12px; }
.empty.good .empty-ico { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.empty.good { border-style: solid; }
.empty.slim { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; }
.empty.slim .empty-ico { margin: 0; width: 44px; height: 44px; font-size: 22px; flex: none; }
.empty.slim p { margin: 0; max-width: none; }
.ico { display: inline-flex; line-height: 0; } .ico svg { display: block; }
.skel { display: flex; flex-direction: column; gap: 14px; }
.skel-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.skel-box, .skel-card, .skel-line { background: linear-gradient(90deg, var(--surface2) 25%, var(--line) 37%, var(--surface2) 63%); background-size: 400% 100%; animation: shim 1.4s ease infinite; border-radius: 10px; }
.skel-box { height: 82px; } .skel-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); animation: none; }
.skel-card .skel-line { height: 14px; } .skel-line { height: 14px; border-radius: 6px; } .skel-line.big { height: 26px; }
.w30 { width: 30%; } .w40 { width: 40%; } .w60 { width: 60%; } .w70 { width: 70%; } .w80 { width: 80%; }
@keyframes shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .skel-box, .skel-line { animation: none; } }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .2s; max-width: min(92vw, 520px); z-index: 20; font-weight: 700; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); color: #fff; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 520px) { .sub-pick { min-width: 100%; } .date-label { font-size: 1.15rem; } }

.avisos { display: flex; flex-direction: column; gap: 10px; }
.badge.inl { margin-left: 8px; vertical-align: middle; display: inline-block; }
.aviso { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 12px; padding: 14px 16px; }
.aviso.hoy { background: var(--accent-soft); border-color: var(--accent); }
.aviso.cancela { border-left-color: var(--muted); opacity: .85; }
.aviso-time { display: flex; flex-direction: column; align-items: center; min-width: 74px; padding: 6px 10px; border-radius: 10px; background: var(--ink); color: var(--bg); line-height: 1.1; }
.aviso-time b { font: 700 1.5rem var(--font-d); font-variant-numeric: tabular-nums; } .aviso-time span { font-size: .8rem; opacity: .75; font-variant-numeric: tabular-nums; } .aviso-time em { font-style: normal; font-size: .7rem; margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
.aviso.cancela .aviso-time { background: var(--surface2); color: var(--muted); } .aviso.cancela .aviso-time b { text-decoration: line-through; }
.aviso-when { display: flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }

<style>
#bnav, #sheet { display: none; }
@media (max-width: 760px) {

  body { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
  #bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 18px rgb(0 0 0 / .06); }
  .bn { flex: 1; min-width: 0; appearance: none; background: none; border: 0; color: var(--muted); font: 700 .72rem var(--font-b); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; min-height: 48px; cursor: pointer; border-radius: 10px; }

  .bn .badge { position: absolute; top: -3px; right: 4px; min-width: 16px; line-height: 16px; font-size: .65rem; padding: 0 4px; }

/* ---- tipografía y ritmo ---- */
body { line-height: 1.5; }
h1 { font-weight: 800; }
h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
h3 { font-size: 1.1rem; font-weight: 700; line-height: 1.25; }
.view { gap: 20px; }
.card { padding: 20px; border-radius: 14px; box-shadow: 0 1px 2px rgb(60 20 20 / .05); }
.card-head { margin-bottom: 14px; }
.date-label { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.field { gap: 6px; }
.field > span { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
input, select, textarea { padding: 10px 12px; border-radius: 10px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); outline-offset: 0; }
.day-head { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 16px 0 4px; display: flex; gap: 8px; align-items: center; }
.row { padding: 14px 0; }
.card > h2:first-child, .card.form > h2 { margin-bottom: 16px; }
.slot-head b { font-family: var(--font-d); font-size: 1rem; }
.stat span { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.pill { letter-spacing: .01em; }
.muted.small, .small.muted { line-height: 1.4; }
@media (max-width: 520px) { .card { padding: 16px; } .date-label { font-size: 1.4rem; } h2 { font-size: 1.25rem; } }

/* ---- micro-interacciones ---- */
.btn { transition: transform .12s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease, filter .15s ease; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 3px 10px rgb(60 20 20 / .12); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.97); box-shadow: none; }
.btn.primary:hover:not(:disabled) { box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent); }
.tab { transition: color .15s ease, border-color .2s ease; } .tab:active { transform: scale(.97); }
.bn:active .bn-ico { transform: scale(.9); } .bn-ico { transition: background-color .2s ease, transform .12s ease, color .2s ease; }
.card, .aviso, .stat { transition: box-shadow .2s ease, border-color .2s ease; }
.aviso:hover, .card:hover { box-shadow: 0 4px 16px rgb(60 20 20 / .08); }
.chip, .pill { transition: background-color .15s ease; }
.toast { display: flex; align-items: center; gap: 10px; }
.toast .ico { font-size: 1.25rem; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.view.enter { animation: enter .28s cubic-bezier(.2, .7, .3, 1) both; }
.view.enter > .card, .view.enter > .summary > .stat, .view.enter > .avisos > * { animation: enter .32s cubic-bezier(.2, .7, .3, 1) both; }
.view.enter > :nth-child(2) { animation-delay: .04s; } .view.enter > :nth-child(3) { animation-delay: .08s; } .view.enter > :nth-child(4) { animation-delay: .12s; } .view.enter > :nth-child(5) { animation-delay: .16s; }
.view.enter > .summary > .stat:nth-child(2) { animation-delay: .06s; } .view.enter > .summary > .stat:nth-child(3) { animation-delay: .12s; }
.sheet-list { animation: enter .2s ease both; } .sheet-bg { animation: fade .2s ease both; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .btn, .tab, .bn-ico, .card, .aviso, .stat { transition: none; }
  .btn:hover:not(:disabled), .btn:active:not(:disabled) { transform: none; }
  .view.enter, .view.enter > *, .view.enter > .summary > .stat, .sheet-list, .sheet-bg { animation: none; }
}

/* ---- avatares ---- */
.av { --d: 46px; position: relative; overflow: hidden; width: var(--d); height: var(--d); border-radius: 50%; display: inline-grid; place-items: center; flex: none; font: 700 max(.7rem, calc(var(--d) * .38)) var(--font-d); letter-spacing: .02em; user-select: none; }

.av0 { background: #3A2E31; color: #fff; } .av1 { background: #C8202C; color: #fff; } .av2 { background: #EBB4AE; color: #3A1418; }
.av3 { background: #A8305E; color: #fff; } .av4 { background: #8A4141; color: #fff; } .av5 { background: #F6D5D0; color: #B3141F; box-shadow: inset 0 0 0 1px #E8B8B2; }
.avJ { background: var(--ink); color: var(--bg); }
.who-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.role-tag { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface2); border-radius: 6px; padding: 2px 7px; }
.role-tag.hl { color: var(--accent); background: var(--accent-soft); }

.chip .av.sm { --d: 26px; margin-left: -6px; }
.chip.pick.on .av { box-shadow: 0 0 0 2px var(--accent-ink); }

/* ---- chat ---- */
.msgs { gap: 2px; padding: 14px; border-radius: 12px; background: var(--surface2); }
.msgrow { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; max-width: 100%; }
.msgrow.grouped { margin-top: 2px; } .msgrow.mine { justify-content: flex-end; }

.msg-meta { font-size: .76rem; font-weight: 700; color: var(--muted); padding-left: 4px; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 12px 6px; display: inline-flex; flex-wrap: wrap; align-items: flex-end; gap: 2px 10px; }
.bubble.tail { border-bottom-left-radius: 5px; } .bubble.mine.tail { border-bottom-left-radius: 16px; border-bottom-right-radius: 5px; }
.bubble.mine { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.bubble.jefe { background: var(--ink); color: var(--bg); border-color: transparent; }
.bubble .msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-time { font-size: .68rem; opacity: .7; margin-left: auto; font-variant-numeric: tabular-nums; }
.seen { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; color: var(--muted); } .seen.all { color: var(--ok); } .seen .ico { font-size: .95rem; }
.msgs .empty.slim { background: transparent; border: 0; }
.composer { gap: 10px; align-items: center; } .composer input { border-radius: 999px; padding: 12px 16px; }
.composer .btn { border-radius: 999px; padding: 11px 20px; }

/* ---- impresión ---- */

@media print {
  @page { margin: 12mm; }

  #tabs, #bnav, #sheet, #toast, #who, .toolbar, .btn, .no-print, .legend + .scroll .cell-sel, input[type="date"], .badge, .composer, .seen, select, .row-end { display: none !important; }
  .app { max-width: none; }

  .scroll { overflow: visible; } .sched { min-width: 0; } .sched tbody th { position: static; }
  .date-label { font-size: 1.4rem; margin-bottom: 6px; }

  .tl-item { background: #f6e6e3; }

  #main .view:has(.sched) > .picker, #main .view:has(.sched) > .card:not(:has(.sched)), .card-head .inline { display: none !important; }
}

/* ---- accesibilidad ---- */
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 100; text-decoration: none; }

<script>
/* ===== Lógica pura: horarios, parseo de tablas de Word y reparto de sustituciones ===== */
const WD = ['L', 'M', 'X', 'J', 'V'];
const WDN = { L: 'Lunes', M: 'Martes', X: 'Miércoles', J: 'Jueves', V: 'Viernes' };
const CLASS_SLOTS = ['1', '2', '3', '4', '5', '6'];
const SLOT_ORDER = ['1', '2', '3', 'R', '4', '5', '6'];
const ROLES = { tutor: 'Primaria', especialista: 'Especialista', pt: 'PT', al: 'AL', directivo: 'Equipo directivo', infantil: 'Infantil', apoyoinf: 'Apoyo de infantil' };
const TIER_NAMES = { 1: 'Hora libre', 2: 'Apoyo', 3: 'PT / AL', 4: 'Directivo', 5: 'Apoyo infantil', 6: 'Coordinación', 7: 'Speaking' };
const CELL_NAMES = { c: 'Clase', l: 'Libre', a: 'Apoyo', o: 'Coordinación', s: 'Desdoble / speaking', n: 'No está' };
const DEFAULT_SESSIONS = {
  '1': '9:00–9:45', '2': '9:45–10:30', '3': '10:30–11:15', 'R': '11:15–11:45',
  '4': '11:45–12:30', '5': '12:30–13:15', '6': '13:15–14:00'
};

const norm = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const isSpecial = (r) => r === 'pt' || r === 'al';
const isPrim = (T) => T.role === 'tutor' || T.role === 'especialista';
const isInfGroup = (g) => /infantil|\binf\b|\b[345]\s?(años|anos|a)\b|\bi[345]\b/i.test(norm(g || ''));

function weekdayKey(date) {
  const [y, m, d] = date.split('-').map(Number);
  return ({ 1: 'L', 2: 'M', 3: 'X', 4: 'J', 5: 'V' })[new Date(y, m - 1, d).getDay()] || null;
}
function slotLabel(s) { return s === 'R' ? 'Recreo' : s + 'ª sesión'; }
function cellOf(T, wd, slot) { return (T && T.sched && T.sched[wd + slot]) || null; }
function presentDay(T, wd) {
  return CLASS_SLOTS.some((s) => { const c = cellOf(T, wd, s); return c && c.t !== 'n'; });
}
function isAbsent(day, tid, slot) {
  return (day.absences || []).some((a) => a.tid === tid && a.slots.includes(slot));
}
/* Vista del patio de un día concreto: si el mes trae calendario por fechas se usa ése; si no, el patrón semanal. */
function patioForDate(patio, date) {
  if (!patio) return patio;
  if (!patio.dates) return patio;
  const e = patio.dates[date] || {};
  const wd = weekdayKey(date);
  return { turns: { [wd]: e.prim || [] }, turnsInf: { [wd]: e.inf || [] }, todos: !!e.todos };
}
function onPatio(patio, wd, tid) {
  return !!(patio && ['turns', 'turnsInf'].some((k) => patio[k] && (patio[k][wd] || []).includes(tid)));
}
function tierOfTeacher(T, wd, slot) {
  if (!T) return 0;
  if (T.role === 'apoyoinf') return 5;
  if (T.role === 'directivo') return 4;
  if (isSpecial(T.role)) return 3;
  const c = cellOf(T, wd, slot);
  return c ? ({ a: 2, o: 6, s: 7 })[c.t] || 1 : 1;
}

/* Qué franjas necesitan sustituto */
function needsFor(day, wd, teachers, patio, strike) {
  strike = strike || [];
  const out = [];
  for (const a of day.absences || []) {
    const T = teachers.find((t) => t.id === a.tid);
    if (!T) continue;
    for (const s of a.slots) {
      if (s === 'R') {
        if (onPatio(patio, wd, T.id)) out.push({ key: a.id + '_R', absId: a.id, absentId: T.id, slot: 'R', place: (patio && patio.turnsInf && (patio.turnsInf[wd] || []).includes(T.id)) ? 'Patio de infantil' : 'Patio', strike: strike.includes(a.id) });
      } else {
        const c = cellOf(T, wd, s);
        if (c && c.t === 'c' && !isSpecial(T.role)) {
          out.push({ key: a.id + '_' + s, absId: a.id, absentId: T.id, slot: s, place: c.g || ('Clase de ' + T.name), subject: c.m || '', strike: strike.includes(a.id) });
        }
      }
    }
  }
  return out;
}

/* Huecos semanales (horas libres + apoyos): la capacidad real de sustituir de cada profesor */
function capacity(T) {
  let n = 0;
  for (const k in (T.sched || {})) { const c = T.sched[k]; if (c && (c.t === 'l' || c.t === 'a')) n++; }
  return Math.max(n, 1);
}
function lectiveDay(T, wd) {
  return CLASS_SLOTS.filter((s) => { const c = cellOf(T, wd, s); return c && c.t === 'c'; }).length;
}

function loadMap(days, exceptDate) {
  const m = {};
  for (const d in days) {
    if (d === exceptDate) continue;
    for (const s of days[d].subs || []) if (s.subId) m[s.subId] = (m[s.subId] || 0) + 1;
  }
  return m;
}

/* Reparto. ctx = {teachers, patio, days, maxDir} */
function assign(day, date, ctx, resetAll) {
  const wd = weekdayKey(date);
  const teachers = ctx.teachers;
  if (!wd) return [];
  ctx = Object.assign({}, ctx, { patio: patioForDate(ctx.patio, date) });
  const needs = needsFor(day, wd, teachers, ctx.patio, ctx.strike);
  const old = new Map((day.subs || []).map((s) => [s.key, s]));
  const load = loadMap(ctx.days, date);
  const used = {};
  const mark = (slot, id) => { (used[slot] = used[slot] || new Set()).add(id); load[id] = (load[id] || 0) + 1; };
  const roleOf = (id) => (teachers.find((t) => t.id === id) || {}).role;
  const dirToday = {};
  const out = [];
  const todo = [];

  for (const n of needs) {
    const o = old.get(n.key);
    const keep = !resetAll && o && o.subId && teachers.some((t) => t.id === o.subId) && !isAbsent(day, o.subId, n.slot) && !(n.strike && !(ctx.sm || []).includes(o.subId));
    if (keep) {
      out.push({ ...n, subId: o.subId, tier: o.tier || 0, fb: !!o.fb, manual: !!o.manual });
      mark(n.slot, o.subId);
      if (roleOf(o.subId) === 'directivo') dirToday[o.subId] = (dirToday[o.subId] || 0) + 1;
    } else todo.push(n);
  }
  // los reservados a mano que quedaron fuera de "needs" no cuentan; el resto se reparte
  todo.sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));

  const candidates = (tier, slot, need) => teachers.filter((T) => {
    if (need && need.strike && !(ctx.sm || []).includes(T.id)) return false;
    if (used[slot] && used[slot].has(T.id)) return false;
    if (isAbsent(day, T.id, slot)) return false;
    if (!presentDay(T, wd)) return false;
    const c = cellOf(T, wd, slot);
    const t = c ? c.t : 'n';
    if (slot === 'R') {
      if (onPatio(ctx.patio, wd, T.id)) return false;
      if (tier === 1) return isPrim(T);
      if (tier === 3) return isSpecial(T.role);
      return false; // el equipo directivo no cubre patio
    }
    if (tier === 1) return isPrim(T) && t === 'l';
    if (tier === 2) return isPrim(T) && t === 'a';
    if (tier === 6) return isPrim(T) && t === 'o';
    if (tier === 7) return isPrim(T) && t === 's';
    if (tier === 3) return isSpecial(T.role) && t !== 'n';
    if (tier === 4) return T.role === 'directivo' && t !== 'n' && (dirToday[T.id] || 0) < ctx.maxDir;
    if (tier === 9) return T.role === 'directivo' && t !== 'n';
    return false;
  });

  for (const n of todo) {
    if (roleOf(n.absentId) === 'infantil') {
      // Infantil: 1 ausente -> profesora de apoyo de infantil; 2 o más -> PT y AL (mejor quien ya da clase en infantil en esa franja)
      const infN = (day.absences || []).filter((a) => a.slots.includes(n.slot) && roleOf(a.tid) === 'infantil').length;
      const kinds = infN >= 2 ? ['pt', 'apoyoinf', 'dir', 'dir9'] : ['apoyoinf', 'pt', 'dir', 'dir9'];
      let got = null;
      for (const kind of kinds) {
        const list = teachers.filter((T) => {
          if (used[n.slot] && used[n.slot].has(T.id)) return false;
          if (isAbsent(day, T.id, n.slot) || !presentDay(T, wd)) return false;
          if (n.strike && !(ctx.sm || []).includes(T.id)) return false;
          if (n.slot === 'R' && onPatio(ctx.patio, wd, T.id)) return false;
          const c = cellOf(T, wd, n.slot), t = n.slot === 'R' ? 'l' : (c ? c.t : 'n');
          if (t === 'n') return false;
          if (n.slot === 'R' && kind.startsWith('dir')) return false; // el equipo directivo no cubre patio
          if (kind === 'apoyoinf') return T.role === 'apoyoinf';
          if (kind === 'pt') return isSpecial(T.role);
          return T.role === 'directivo' && !!T.cubreInf && (kind === 'dir9' || (dirToday[T.id] || 0) < ctx.maxDir);
        });
        if (!list.length) continue;
        const rank = (T) => {
          const c = cellOf(T, wd, n.slot), t = n.slot === 'R' ? 'l' : (c ? c.t : 'n');
          if (kind === 'pt') return t === 'c' && isInfGroup(c.g) ? 0 : ({ l: 1, a: 2, c: 3 })[t];
          if (kind === 'apoyoinf') return t === 'c' ? 1 : 0;
          return 0;
        };
        const score = (T) => kind.startsWith('dir') ? lectiveDay(T, wd) + (dirToday[T.id] || 0) : (load[T.id] || 0) / capacity(T);
        list.sort((a, b) => rank(a) - rank(b) || score(a) - score(b) || a.name.localeCompare(b.name, 'es'));
        got = { T: list[0], kind, fb: kind !== kinds[0] };
        break;
      }
      if (got) {
        mark(n.slot, got.T.id);
        if (got.kind.startsWith('dir')) dirToday[got.T.id] = (dirToday[got.T.id] || 0) + 1;
        out.push({ ...n, subId: got.T.id, tier: got.kind === 'apoyoinf' ? 5 : got.kind === 'pt' ? 3 : 4, fb: got.fb || got.kind === 'dir9', manual: false });
      } else out.push({ ...n, subId: null, tier: 0, fb: false, manual: false });
      continue;
    }
    const absentNow = (day.absences || []).filter((a) => a.slots.includes(n.slot) && roleOf(a.tid) !== 'infantil').length;
    const start = 1;
    // Fuentes permitidas según cuántos profesores faltan a la vez (en este orden):
    //  1 ausente: libre, coordinación, directivo (no se quitan apoyos)
    //  2 ausentes: libre, coordinación, apoyo (y speaking), directivo
    //  3 o más: libre, coordinación, apoyo (y speaking), PT/AL, directivo
    const order = absentNow <= 1 ? [1, 6, 4, 9] : absentNow === 2 ? [1, 6, 2, 7, 4, 9] : [1, 6, 2, 7, 3, 4, 9];
    let picked = null, pickedTier = 0;
    for (const tier of order) {
      const list = candidates(tier, n.slot, n);
      if (!list.length) continue;
      const rank = (T) => {
        if (tier === 2 && n.slot !== 'R') { const c = cellOf(T, wd, n.slot); return c && c.g && n.place && norm(n.place).includes(norm(c.g)) ? 0 : 1; }
        if (!(tier === 3 || tier === 4 || tier === 9) || n.slot === 'R') return 0;
        const c = cellOf(T, wd, n.slot);
        return ({ l: 0, o: 1, s: 1, a: 2, c: 3 })[c ? c.t : 'c'];
      };
      // Directivos: compensar clases del día con sustituciones. Resto: sustituciones pasadas en proporción a sus huecos.
      const score = (T) => (tier === 4 || tier === 9) ? lectiveDay(T, wd) + (dirToday[T.id] || 0) : (load[T.id] || 0) / capacity(T);
      list.sort((a, b) => rank(a) - rank(b) || score(a) - score(b) || (load[a.id] || 0) - (load[b.id] || 0) || a.name.localeCompare(b.name, 'es'));
      picked = list[0]; pickedTier = tier; break;
    }
    if (picked) {
      mark(n.slot, picked.id);
      if (picked.role === 'directivo') dirToday[picked.id] = (dirToday[picked.id] || 0) + 1;
      out.push({ ...n, subId: picked.id, tier: pickedTier === 9 ? 4 : pickedTier, fb: pickedTier === 9, manual: false });
    } else {
      out.push({ ...n, subId: null, tier: 0, fb: false, manual: false });
    }
  }
  out.sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot) || a.absentId.localeCompare(b.absentId));
  return out;
}

/* ===== Importación desde tablas de Word ===== */
function parseCell(raw) {
  if (raw == null) return { t: 'n', g: '' };
  const txt = String(raw).replace(/\s+/g, ' ').trim();
  const n = norm(txt);
  if (!txt) return { t: 'l', g: '' };                                   // celda vacía = libre
  if (/^(-+|—|–|x|no|n\/a|ausente)$/.test(n)) return { t: 'n', g: '' };   // guion = no está
  if (/^(hora )?libre|^disponible|^(l|lib)$/.test(n)) return { t: 'l', g: '' };
  if (/^(coo|coord)|^reunion|^gestion/.test(n)) return { t: 'o', g: '' }; // COO = coordinación
  const sp = txt.match(/^(spk|speaking|desdoble)\b[\s:\-–.]*(.*)$/i);   // SPK = speaking (desdoble)
  if (sp) return { t: 's', g: sp[2].trim() };
  const m = txt.match(/^(ap\.?|apoyo|refuerzo)\b[\s:\-–.]*(.*)$/i);      // AP = apoyo
  if (m) return { t: 'a', g: m[2].trim() };
  return { t: 'c', g: txt };
}
function splitRows(text) {
  const rows = text.split(/\r?\n/).filter((r) => r.trim());
  const useTab = rows.some((r) => r.includes('\t'));
  return rows.map((r) => useTab ? r.split('\t') : (r.includes('|') ? r.split('|') : r.split(/\s{2,}/)));
}
function parseTable(text) {
  let rows = splitRows(text);
  const hi = rows.findIndex((r) => /lunes|martes/.test(norm(r.join(' '))) || (r.filter((c) => /^[LMXJV]$/i.test(c.trim())).length >= 4));
  if (hi >= 0) rows = rows.slice(hi + 1);
  rows = rows.filter((r) => !/recreo|almuerzo|comedor/.test(norm(r.join(' '))));
  const sched = {};
  rows.slice(0, 6).forEach((r, i) => {
    const cells = r.length > 5 ? r.slice(-5) : r;
    WD.forEach((d, j) => { sched[d + CLASS_SLOTS[i]] = parseCell(cells[j]); });
  });
  return sched;
}
function parseRole(s) {
  const n = norm(s);
  if (/apoyo.*infantil|infantil.*apoyo/.test(n)) return 'apoyoinf';
  if (/^pt\b|terapeutica|pedagogia/.test(n)) return 'pt';
  if (/^al\b|audicion|lenguaje/.test(n)) return 'al';
  if (/direc|jefe|jefa|secret|equipo/.test(n)) return 'directivo';
  if (/infantil|3 anos|4 anos|5 anos/.test(n)) return 'infantil';
  if (/especial|ingl|music|fisica|\bef\b|franc|religi|plastica|especialista/.test(n)) return 'especialista';
  return 'tutor';
}
/* Bloques "@Nombre | rol" seguidos de su tabla. Sin "@", devuelve null. */
function parseBulk(text) {
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let cur = null;
  for (const l of lines) {
    if (/^\s*@/.test(l)) {
      const [name, role] = l.replace(/^\s*@/, '').split('|');
      cur = { name: (name || '').trim(), role: parseRole(role || ''), cubreInf: /infantil/.test(norm(role || '')), body: [] };
      blocks.push(cur);
    } else if (cur) cur.body.push(l);
  }
  if (!blocks.length) return null;
  return blocks.filter((b) => b.name).map((b) => ({ name: b.name, role: b.role, cubreInf: b.role === 'directivo' && b.cubreInf, sched: parseTable(b.body.join('\n')) }));
}
function matchTeacher(name, teachers) {
  const n = norm(name);
  if (!n) return null;
  let best = teachers.find((t) => norm(t.name) === n);
  if (best) return best;
  const hits = teachers.filter((t) => norm(t.name).includes(n) || n.includes(norm(t.name)));
  return hits.length === 1 ? hits[0] : null;
}
function parsePatios(text, teachers) {
  const turns = { L: [], M: [], X: [], J: [], V: [] };
  const unknown = [];
  const key = { lunes: 'L', martes: 'M', miercoles: 'X', jueves: 'J', viernes: 'V', l: 'L', m: 'M', x: 'X', j: 'J', v: 'V' };
  for (const line of text.split(/\r?\n/)) {
    const i = line.indexOf(':');
    if (i < 0) continue;
    const d = key[norm(line.slice(0, i))];
    if (!d) continue;
    for (const nm of line.slice(i + 1).split(/[,;]/)) {
      if (!nm.trim()) continue;
      const T = matchTeacher(nm, teachers);
      if (T) { if (!turns[d].includes(T.id)) turns[d].push(T.id); } else unknown.push(nm.trim());
    }
  }
  return { turns, unknown };
}

(() => { const ap = Element.prototype.append; Element.prototype.append = function (...a) { return ap.apply(this, a.flat(Infinity).filter((x) => x != null && x !== false)); }; })();
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let val;
  for (const k in props || {}) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value') val = v;
    else if (k === 'checked') el.checked = true;
    else if (k === 'disabled') el.disabled = true;

  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  if (val !== undefined) el.value = val;
  return el;
}

async function saveDay(date, next, old) {

  S.days[date] = next;

  await S.db.doc('days/' + date).set(next);
  for (const n of out) await S.db.collection('notifs').add(n);

}

function printPw(users) {
  const ok = users.filter((u) => u.password);
  if (!ok.length) return toast('No hay contraseñas que imprimir.', true);
  const url = location.origin;
  const box = h('div', { id: 'pwprint' },
    h('h1', null, 'Sustituciones · CEIP Gabriel Celaya'),
    h('p', null, 'Tarjetas de acceso. Recorta cada una y entrégala a su destinatario. No compartas tu contraseña.'),
    h('div', { class: 'slips' }, ok.map((u) => h('div', { class: 'slip' },
      h('img', { src: QR_PNG, alt: 'QR de acceso a la app', class: 'qr' }),
      h('b', null, 'Acceso a la app de sustituciones'),
      h('div', null, 'Dirección: ', h('b', null, url.replace(/^https?:\/\//, ''))),
      h('div', null, 'Correo: ', h('b', null, u.email)),
      h('div', null, 'Contraseña: ', h('b', { class: 'pw' }, u.password))))));
  document.body.append(box); document.body.classList.add('print-pw');
  const done = () => { document.body.classList.remove('print-pw'); box.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  const imgs = [...box.querySelectorAll('img')];
  Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; })))).then(() => setTimeout(doPrint, 100));
}

      teachersOnly.length ? h('div', { class: 'row-end' }, h('button', { class: 'btn', onclick: (ev) => { const b = ev.currentTarget; if (b.dataset.armed) { b.dataset.armed = ''; b.textContent = 'Generar contraseñas para todo el profesorado'; gen(teachersOnly, b); return; } b.dataset.armed = '1'; b.textContent = 'Pulsa otra vez: se restablecerán las de todos'; setTimeout(() => { b.dataset.armed = ''; b.textContent = 'Generar contraseñas para todo el profesorado'; }, 4000); } }, 'Generar contraseñas para todo el profesorado')) : null,
      res,
      ta, h('div', { class: 'row-end' }, h('button', { class: 'btn primary', onclick: async () => { const n = await window.accessApi.add(ta.value); ta.value = ''; toast(n + ' correo' + (n === 1 ? '' : 's') + ' añadido' + (n === 1 ? '' : 's')); } }, icon('plus'), 'Añadir')));
  },
  render() {
    const el = this.el; el.textContent = '';
    el.append(h('h2', { class: 'cap' }, 'Centro'));
    // criterio
    el.append(h('div', { class: 'card' }, h('h3', null, 'Cómo reparte la app las sustituciones'),
      h('p', { class: 'muted small' }, 'En cada franja se cuenta cuántos profesores faltan a la vez y se cubre con estas fuentes, en este orden:'),
      h('ol', { class: 'steps' },
        h('li', null, h('b', null, '1 ausente: '), 'hora libre, coordinación (COO) y equipo directivo. No se quitan apoyos.'),
        h('li', null, h('b', null, '2 ausentes: '), 'hora libre, coordinación, apoyos (y speaking) y equipo directivo.'),
        h('li', null, h('b', null, '3 o más: '), 'hora libre, coordinación, apoyos (y speaking), PT y AL y, por último, equipo directivo.'),
        h('li', null, h('b', null, 'Infantil: '), 'si falta un profesor de infantil lo cubre la profesora de apoyo de infantil. Si faltan 2 o más a la vez, entran PT y AL, mejor quien en esa franja ya esté dando clase en infantil (pon “Infantil” o “4 años” en el grupo de su horario).'),
        h('li', null, h('b', null, 'Equipo directivo: '), 'siempre el último nivel, hasta ' + (S.school.maxDir || 2) + ' sustituciones al día cada uno; si no queda nadie más, cubre aunque lo supere. El equipo directivo no cubre el patio. Entre ellos se elige a quien tenga menos carga ese día (clases propias + sustituciones), para que la carga lectiva quede equilibrada.')),
      h('p', { class: 'muted small' }, 'Huelga: cuando una ausencia se marca como huelga, solo la pueden cubrir los profesores marcados como servicios mínimos ese día, con el mismo orden de criterios. El motivo solo lo ves tú.'),
      h('p', { class: 'muted small' }, 'Si en ninguno de los niveles permitidos queda nadie, el equipo directivo la cubre siempre, aunque supere el máximo diario (se marca como “criterio ampliado”). Entre el resto, elige a quien menos ha sustituido en el pasado en proporción a sus huecos y apoyos semanales, así el profesorado de primaria, que tiene más, sustituye más de forma natural y los especialistas (inglés, música, educación física) no quedan cargados. Los recreos se cubren con quien no tenga turno de patio ese día.')));
    // ajustes
    const max = h('input', { type: 'number', id: 'max-dir', min: 0, max: 9, value: S.school.maxDir || 2, onchange: (e) => { const v = Math.max(0, Math.min(9, parseInt(e.target.value, 10) || 0)); saveSchool((s) => { s.maxDir = v; }); } });
    const times = h('div', { class: 'times' }, SLOT_ORDER.map((s) => h('label', { class: 'field' }, h('span', null, slotLabel(s)),
      h('input', { type: 'text', value: sessTime(s), 'aria-label': 'Horario ' + slotLabel(s), onchange: (e) => saveSchool((x) => { x.sessions = x.sessions || {}; x.sessions[s] = e.target.value.trim(); }) }))));
    const mkNum = (id, lbl, val, f) => h('label', { class: 'field short' }, h('span', null, lbl), h('input', { type: 'number', id, min: 0, max: 20, value: val, onchange: (e) => { const v = Math.max(0, Math.min(20, parseInt(e.target.value, 10) || 0)); saveSchool((x) => { x[f] = v; }); } }));
    if (window.accessApi) el.append(this.accessCard());
    el.append(h('div', { class: 'card' }, h('h3', null, 'Patios'), h('div', { class: 'row-wrap' }, mkNum('patio-prim', 'Profesores por día en el patio de primaria', S.school.patioPrim || 6, 'patioPrim'), mkNum('patio-inf', 'Profesores por día en el patio de infantil', S.school.patioInf || 5, 'patioInf'))));
    el.append(h('div', { class: 'card' }, h('h3', null, 'Horario de sesiones'), times,
      h('label', { class: 'field short' }, h('span', null, 'Máximo de sustituciones por día de cada miembro del equipo directivo'), max)));
    // compartir
    el.append(h('div', { class: 'card' }, h('h3', null, 'Que el profesorado entre'),
      h('p', null, 'Usa el botón Compartir de esta página e invita a cada profesor/a con permiso de colaborador. Con ese permiso pueden ver sus avisos y escribir en el chat, pero no cambiar horarios ni ausencias. Al entrar por primera vez eligen su nombre en “Mis sustituciones”.')));
    // datos
    const ex = h('button', { class: 'btn', onclick: () => this.loadExample() }, 'Cargar datos de ejemplo');
    const wipe = h('button', { class: 'btn danger', onclick: () => {
      if (wipe.dataset.armed) return this.wipe();
      wipe.dataset.armed = '1'; wipe.textContent = 'Seguro. Pulsa otra vez para borrarlo todo';
      setTimeout(() => { wipe.dataset.armed = ''; wipe.textContent = 'Borrar todos los datos'; }, 4000);
    } }, 'Borrar todos los datos');
    el.append(h('div', { class: 'card' }, h('h3', null, 'Datos'), h('p', { class: 'muted small' }, 'Para probar la app sin tocar los datos reales, carga el ejemplo y bórralo cuando termines.'), h('div', { class: 'row-wrap' }, ex, wipe)));
  },
  loadExample() {
    const E = buildExample(), month = todayStr().slice(0, 7);
    saveSchool((s) => { s.teachers = E.teachers; s.example = true; });
    savePatio(month, (p) => { p.turns = E.turns; p.turnsInf = E.turnsInf; });
    toast('Datos de ejemplo cargados. Prueba a registrar ausencias en Hoy.');
  },
  wipe() {
    enqueue(async () => {
      const db = S.db;
      for (const d of Object.keys(S.days)) {
        try { const m = await db.collection('chats/' + d + '/msgs').get(); for (const x of m.docs) await db.doc('chats/' + d + '/msgs/' + x.id).delete(); } catch (e) {}
        await db.doc('days/' + d).delete();
      }
      for (const m of Object.keys(S.patios)) await db.doc('patios/' + m).delete();
      for (const w of Object.keys(S.sm)) await db.doc('sm/' + w).delete();
      for (const p of Object.keys(S.priv)) await db.doc('private/' + p).delete();
      const all = await db.collection('notifs').get();
      for (const x of all.docs) await db.doc('notifs/' + x.id).delete();
      S.school = DEFAULT_SCHOOL(); S.days = {}; S.patios = {}; S.selT = null; S.chatDate = null;
      await db.doc('school/main').set(S.school);
      renderAll();
      toast('Todos los datos se han borrado.');
    });
  }
};
views.centro = Centro;

/* =====================================================  ARRANQUE  */
async function boot() {
  const main = $('#main');
  const claude = window.claude;
  S.db = claude && claude.use ? await claude.use('db') : null;
  S.user = claude && claude.use ? await claude.use('user') : null;
  if (!S.db) {
    main.append(empty('Entra desde Claude con tu sesión iniciada', 'Esta página guarda los horarios y las sustituciones del centro, y solo funciona abierta desde el enlace compartido con tu cuenta.', null, 'lock'));
    return;
  }
  S.skel = h('div', { id: 'skel' }, skeleton()); main.append(S.skel);
  S.uid = S.user ? await S.user.id() : null;
  S.admin = S.user ? await S.user.canEdit() : false;
  S.canWrite = S.user ? await S.user.can('data.write') : null;
  S.myTid = S.user && S.user.tid ? await S.user.tid() : null;
  // con cuentas propias (Firebase), el profesorado queda ligado a su ficha y no puede elegir otra
  S.locked = !!window.accessApi && !S.admin;
  if (S.locked || S.myTid) S.me = S.myTid || null;
  else { try { S.me = localStorage.getItem(LS_ME) || null; } catch (e) {} }
  renderAll();

  const timer = setTimeout(() => { if (!S.loaded.school) toast('Los datos tardan en llegar. Comprueba tu conexión.', true); }, 10000);
  S.db.doc('school/main').onSnapshot((snap) => {
    clearTimeout(timer);
    S.school = snap.exists ? { ...DEFAULT_SCHOOL(), ...snap.data() } : DEFAULT_SCHOOL();
    S.school.sessions = { ...DEFAULT_SESSIONS, ...(S.school.sessions || {}) };
    S.loaded.school = true; renderAll();
  }, () => { S.loaded.school = true; renderAll(); });
  S.db.collection('days').onSnapshot((snap) => {
    S.days = {}; snap.docs.forEach((d) => { S.days[d.id] = d.data(); });
    S.loaded.days = true; renderAll();
    if (views.chat.built) refresh(views.chat);
    if (views.panel.built) refresh(views.panel);
  }, () => {});
  S.db.collection('patios').onSnapshot((snap) => {
    S.patios = {}; snap.docs.forEach((d) => { S.patios[d.id] = d.data(); });
    S.loaded.patios = true; renderAll();
  }, () => {});
  S.db.collection('sm').onSnapshot((snap) => {
    S.sm = {}; snap.docs.forEach((d) => { S.sm[d.id] = d.data(); });
    renderAll();
  }, () => {});
  if (S.admin) {
    S.db.collection('private').onSnapshot((snap) => {
      S.priv = {}; snap.docs.forEach((d) => { S.priv[d.id] = d.data(); });
      renderAll();
    }, () => {});
  }
  if (S.uid) {
    S.db.doc('data/users/' + S.uid + '/profile').onSnapshot((snap) => {
      if (!S.locked && !S.myTid && snap.exists && snap.data().tid && snap.data().tid !== S.me) { S.me = snap.data().tid; subscribeNotifs(); renderAll(); }
    }, () => {});
  }
  if (window.accessApi && S.admin) window.accessApi.subscribe((l) => { S.access = l; if (views.centro.built) refresh(views.centro); });
  subscribeNotifs();
}
boot();
</script></body></html>
